name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, json, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run tests
        run: composer test

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, json, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs:check

      - name: Run PHPStan
        run: composer analyse

      - name: Run Psalm
        run: composer psalm

      - name: Verify the vendored spec and that the merge reproduces it
        run: composer spec:verify

      - name: Audit the operations against the spec (S2)
        run: composer conformance

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, json, mbstring
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # S4: tools/coverage fails the job below 95% of lines. pcov.directory is set by the
      # composer script; without it pcov instruments src/ only and tools/src reads as 0%.
      - name: Run tests with coverage
        shell: bash
        run: composer test:coverage 2>&1 | tee coverage.txt

      - name: Summarise coverage
        if: always()
        shell: bash
        run: |
          {
            echo '### Line coverage'
            echo '```'
            grep -E '^(src|tools|total) ' coverage.txt || echo 'no coverage report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
